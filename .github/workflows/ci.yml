name: CI

# Structural validation for the multi-agent packaging. The three manifests
# (Copilot / Claude / Codex) and three marketplace files must stay in agreement;
# this catches drift and typos before anyone installs a broken plugin.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Helper and authentication tests
        working-directory: plugins/artifacts-beam/skills/artifacts-beam
        run: node --test

  marketplaces:
    name: Native Claude and Copilot marketplaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned maintainer validators
        run: |
          npm install --prefix "$RUNNER_TEMP/marketplace-clis" --no-save --no-package-lock --no-audit --no-fund \
            @anthropic-ai/claude-code@2.1.296 @github/copilot@1.0.98
          echo "$RUNNER_TEMP/marketplace-clis/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Validate and install the candidate in isolated profiles
        run: node scripts/validate-marketplaces.mjs

  validate:
    name: Validate plugin manifests
    needs: [runtime, marketplaces]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate manifests + marketplaces
        run: node scripts/validate-plugins.mjs
      - name: Syntax-check the helper and its modules
        run: |
          for f in scripts/*.mjs \
                   plugins/artifacts-beam/skills/artifacts-beam/scripts/abeam.mjs \
                   plugins/artifacts-beam/skills/artifacts-beam/scripts/lib/*.mjs; do
            node --check "$f"
          done
      - name: Packaging tests
        run: node --test scripts/openai-package.test.mjs
      - name: Build OpenAI upload package
        run: node scripts/package-openai.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-beam-openai
          path: dist/artifacts-beam-openai-*.zip
          if-no-files-found: error
