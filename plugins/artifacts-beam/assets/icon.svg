<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 224" role="img" aria-labelledby="title desc">
  <title id="title">Artifacts Beam icon</title>
  <desc id="desc">A command-line prompt beaming a bright spark of an idea, on a blue-to-violet tile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1273d4" />
